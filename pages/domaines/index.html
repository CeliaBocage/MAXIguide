<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="domaines.pageTitle">MAXIguide — Domaines</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#fdf4ee">
  <link rel="icon" href="../../icon.svg">
  <link rel="apple-touch-icon" href="../../icons/icon-512.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MAXIguide">
</head>
<body>
  <main class="container">
    <div class="view-toggle">
      <button type="button" id="toggle-list" class="btn btn-toggle active" data-i18n="domaines.viewList">Liste</button>
      <button type="button" id="toggle-plan" class="btn btn-toggle" data-i18n="domaines.viewPlan">Plan du parc</button>
    </div>

    <section id="view-list">
      <h2 data-i18n="domaines.heading">Les domaines</h2>
      <input type="search" id="list-search" class="list-search"
             data-i18n-placeholder="domaines.searchPlaceholder"
             placeholder="Chercher un domaine ou un n° de stand…">
      <div id="list-filters" class="list-filters">
        <!-- chips Tous / À déguster / Notés remplies par domaines.js -->
      </div>
      <ul id="domaine-list" class="domaine-list">
        <!-- rempli par domaines.js -->
      </ul>
      <p id="list-empty" class="list-empty muted" data-i18n="domaines.searchEmpty" hidden>
        Aucun domaine ne correspond.
      </p>
    </section>

    <section id="view-plan" hidden>
      <h2 data-i18n="domaines.planHeading">Plan du parc</h2>
      <p class="muted" data-i18n="domaines.planHint">Touchez un stand pour le noter — les stands verts sont déjà dans votre guide.</p>
      <div id="plan-container" class="plan-container"></div>
    </section>
  </main>

  <script src="../../secrets/config.js"></script>
  <script src="../../js/i18n.js"></script>
  <script src="../../js/db.js"></script>
  <script src="../../js/data/domaines.js"></script>
  <script src="../../js/data/plan.js"></script>
  <script src="../../js/svg.js"></script>
  <script src="../../js/plan.js"></script>
  <script src="../../js/storage.js"></script>
  <script>const BASE = '../../';</script>
  <script src="../../js/header.js"></script>
  <script src="domaines.js"></script>
  <script src="../../js/pwa.js"></script>
</body>
</html>
