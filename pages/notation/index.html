<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="notation.pageTitle">MAXIguide — Notation</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#fdf4ee">
  <link rel="icon" href="../../icon.svg">
  <link rel="apple-touch-icon" href="../../icons/icon-512.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MAXIguide">
</head>
<body>
  <main class="container">
    <section>
      <h1 id="domaine-name" class="notation-title">…</h1>
      <p class="tagline" id="notation-sub">…</p>

      <h2 data-i18n="notation.drinks">Les vins</h2>
      <div id="note-rows" class="note-rows">
        <!-- rangées ⚪🔴🌸 remplies par notation.js -->
      </div>

      <h2 data-i18n="notation.stickers">Les stickers</h2>
      <p class="muted sticker-hint" data-i18n="notation.stickerHint">1 c'est excellent, 2 c'est exceptionnel… 5 c'est légendaire !</p>
      <div id="sticker-rows" class="note-rows">
        <!-- chips ❤️⭐ + bouton « Ajouter un sticker » remplis par notation.js -->
      </div>

      <h2 data-i18n="notation.comment">Un petit mot ?</h2>
      <textarea id="commentaire" class="commentaire" rows="3" data-i18n-placeholder="notation.commentPlaceholder"
        placeholder="Votre note écrite (facultatif) : une anecdote, un vin à retenir…"></textarea>

      <p class="muted photo-hint" data-i18n="notation.photoHint">Vous avez surkiffé une bouteille ? Gardez-en jusqu’à 3 photos !</p>
      <div id="photo-row">
        <!-- vignettes 📷 (avec ✕) remplies par notation.js -->
      </div>
      <button type="button" id="add-photo-btn" class="btn btn-secondary add-photo-btn" data-i18n="notation.addPhoto">📷 Ajouter une photo</button>
      <input type="file" id="photo-input" accept="image/*" hidden>
      <p id="photo-error" class="photo-error" hidden></p>

      <div class="actions">
        <button type="button" id="save-btn" class="btn btn-primary" data-i18n="notation.save">Enregistrer</button>
      </div>
      <p id="saved-msg" class="saved-msg" hidden>✔ Fiche enregistrée !</p>
    </section>

    <nav class="stand-nav">
      <a id="nav-prev" class="stand-nav-link prev" href="#"></a>
      <a id="nav-next" class="stand-nav-link next" href="#"></a>
    </nav>

    <div class="actions">
      <a href="../domaines/index.html" class="link-back" data-i18n="notation.back">← Retour aux domaines</a>
    </div>
  </main>

  <script src="../../secrets/config.js"></script>
  <script src="../../js/i18n.js"></script>
  <script src="../../js/db.js"></script>
  <script src="../../js/emoji.js"></script>
  <script src="../../js/photos.js"></script>
  <script src="../../js/bottle.js"></script>
  <script src="../../js/data/domaines.js"></script>
  <script src="../../js/storage.js"></script>
  <script>const BASE = '../../';</script>
  <script src="../../js/header.js"></script>
  <script src="notation.js"></script>
  <script src="../../js/pwa.js"></script>
</body>
</html>
